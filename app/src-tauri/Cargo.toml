[package]
name = "pulse-app"
version = "0.1.0"
description = "Pulse — A Trust-Topological Discourse Network"
authors = []
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"

pulse-identity = { path = "../../crates/pulse-identity" }
pulse-stub = { path = "../../crates/pulse-stub" }
pulse-store = { path = "../../crates/pulse-store" }
pulse-graph = { path = "../../crates/pulse-graph" }
pulse-network = { path = "../../crates/pulse-network" }
dirs-next = "2"
libp2p = { version = "0.56", features = ["tokio"] }

